<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>オレ(au lait) 表情プレビュー</title>
<style>
  :root{
    --cream:#FFF8EE;
    --mint:#E4F5EE;
    --pale-blue:#EAF2FB;
    --ink:#5A4B42;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:24px;
    font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Yu Gothic",sans-serif;
    background:linear-gradient(160deg,var(--cream),var(--pale-blue) 60%,var(--mint));
    min-height:100vh;
    color:var(--ink);
  }
  h1{ text-align:center; font-size:1.4rem; margin:0 0 6px; }
  p.lead{ text-align:center; margin:0 0 24px; font-size:0.95rem; opacity:0.8; }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    max-width:1200px;
    margin:0 auto;
  }
  .card{
    background:#fff;
    border-radius:28px;
    padding:16px;
    text-align:center;
    box-shadow:0 6px 18px rgba(154,133,121,0.18);
  }
  .card svg{ width:100%; height:auto; max-width:220px; }
  .card .label{ margin-top:8px; font-weight:bold; font-size:1.05rem; }
  .card .sub{ font-size:0.8rem; opacity:0.65; }

  /* ===== まばたき ===== */
  @keyframes blink{
    0%,92%,100%{ transform:scaleY(1); }
    94%,97%{ transform:scaleY(0.08); }
  }
  .eye-group{ transform-origin:center; animation:blink 5s infinite; }
  .eye-group.eye2{ animation-delay:0.3s; }

  /* ===== ヒゲの微揺れ ===== */
  @keyframes whisker{
    0%,100%{ transform:rotate(0deg); }
    50%{ transform:rotate(2deg); }
  }
  .whiskers-left{ transform-origin:95px 165px; animation:whisker 3.2s ease-in-out infinite; }
  .whiskers-right{ transform-origin:185px 165px; animation:whisker 3.2s ease-in-out infinite reverse; }

  /* ===== 耳ぴくっ ===== */
  @keyframes earTwitch{
    0%,88%,100%{ transform:rotate(0deg); }
    90%{ transform:rotate(-6deg); }
    92%{ transform:rotate(3deg); }
    94%{ transform:rotate(0deg); }
  }
  .ear-left{ transform-origin:88px 95px; animation:earTwitch 6s infinite; }
  .ear-right{ transform-origin:192px 95px; animation:earTwitch 6s infinite 0.5s; }

  /* ===== せいかい:ぴょこん ===== */
  @keyframes bounce{
    0%,100%{ transform:translateY(0); }
    30%{ transform:translateY(-14px); }
    50%{ transform:translateY(2px); }
    70%{ transform:translateY(-6px); }
  }
  .bounce{ animation:bounce 0.7s ease-out infinite; }
</style>
</head>
<body>
<h1>🐾 オレ(au lait) 表情プレビュー v2</h1>
<p class="lead">丸くてフラットな見た目に描き直しました。まばたき・ヒゲの微揺れ・耳ぴくっが常時動いています。</p>

<div class="grid">

  <!-- ============ 1. つうじょう ============ -->
  <div class="card">
    <svg viewBox="0 0 280 260">
      <g class="ear-left">
        <polygon points="95,100 55,20 122,78" fill="#9A8579"/>
        <polygon points="95,92 70,38 110,74" fill="#E9B7BA"/>
      </g>
      <g class="ear-right">
        <polygon points="185,100 225,20 158,78" fill="#9A8579"/>
        <polygon points="185,92 210,38 170,74" fill="#E9B7BA"/>
      </g>
      <circle cx="140" cy="150" r="92" fill="#F6EFE6" stroke="#9A8579" stroke-width="1"/>
      <!-- 目 -->
      <g class="eye-group eye1">
        <ellipse cx="108" cy="150" rx="15" ry="17" fill="#fff"/>
        <ellipse cx="108" cy="151" rx="12" ry="14" fill="#5D9CD6"/>
        <ellipse cx="108" cy="153" rx="5" ry="8" fill="#2b3a42"/>
        <circle cx="103" cy="145" r="3" fill="#fff"/>
      </g>
      <g class="eye-group eye2">
        <ellipse cx="172" cy="150" rx="15" ry="17" fill="#fff"/>
        <ellipse cx="172" cy="151" rx="12" ry="14" fill="#5D9CD6"/>
        <ellipse cx="172" cy="153" rx="5" ry="8" fill="#2b3a42"/>
        <circle cx="167" cy="145" r="3" fill="#fff"/>
      </g>
      <!-- 鼻 -->
      <polygon points="133,178 147,178 140,187" fill="#E39AA0"/>
      <!-- 口(W字) -->
      <path d="M124 190 Q132 198 140 190 Q148 198 156 190" fill="none" stroke="#9A8579" stroke-width="1.6" stroke-linecap="round"/>
      <!-- ヒゲ -->
      <g class="whiskers-left" stroke="#c9bdb2" stroke-width="1">
        <line x1="95" y1="178" x2="42" y2="168"/>
        <line x1="95" y1="185" x2="40" y2="188"/>
        <line x1="95" y1="192" x2="44" y2="206"/>
      </g>
      <g class="whiskers-right" stroke="#c9bdb2" stroke-width="1">
        <line x1="185" y1="178" x2="238" y2="168"/>
        <line x1="185" y1="185" x2="240" y2="188"/>
        <line x1="185" y1="192" x2="236" y2="206"/>
      </g>
    </svg>
    <div class="label">つうじょう</div>
    <div class="sub">いつものオレ</div>
  </div>

  <!-- ============ 2. わくわく(出題時) ============ -->
  <div class="card">
    <svg viewBox="0 0 280 260">
      <g style="transform:rotate(-10deg)" transform-origin="88 95">
        <polygon points="95,100 55,20 122,78" fill="#9A8579"/>
        <polygon points="95,92 70,38 110,74" fill="#E9B7BA"/>
      </g>
      <g style="transform:rotate(10deg)" transform-origin="192 95">
        <polygon points="185,100 225,20 158,78" fill="#9A8579"/>
        <polygon points="185,92 210,38 170,74" fill="#E9B7BA"/>
      </g>
      <circle cx="140" cy="150" r="92" fill="#F6EFE6" stroke="#9A8579" stroke-width="1"/>
      <!-- 目(キラッと大きめ) -->
      <ellipse cx="108" cy="148" rx="17" ry="19" fill="#fff"/>
      <ellipse cx="108" cy="149" rx="14" ry="16" fill="#5D9CD6"/>
      <ellipse cx="108" cy="151" rx="5.5" ry="9" fill="#2b3a42"/>
      <circle cx="102" cy="142" r="3.5" fill="#fff"/>
      <circle cx="112" cy="156" r="1.8" fill="#fff" opacity="0.85"/>
      <ellipse cx="172" cy="148" rx="17" ry="19" fill="#fff"/>
      <ellipse cx="172" cy="149" rx="14" ry="16" fill="#5D9CD6"/>
      <ellipse cx="172" cy="151" rx="5.5" ry="9" fill="#2b3a42"/>
      <circle cx="166" cy="142" r="3.5" fill="#fff"/>
      <circle cx="176" cy="156" r="1.8" fill="#fff" opacity="0.85"/>
      <polygon points="133,178 147,178 140,187" fill="#E39AA0"/>
      <!-- 口(少し開けて) -->
      <path d="M126 190 Q140 202 154 190" fill="#B5645C"/>
      <path d="M126 190 Q140 202 154 190" fill="none" stroke="#9A8579" stroke-width="1.4"/>
      <g stroke="#c9bdb2" stroke-width="1">
        <line x1="95" y1="176" x2="40" y2="164"/>
        <line x1="95" y1="184" x2="38" y2="184"/>
        <line x1="95" y1="192" x2="42" y2="204"/>
        <line x1="185" y1="176" x2="240" y2="164"/>
        <line x1="185" y1="184" x2="242" y2="184"/>
        <line x1="185" y1="192" x2="238" y2="204"/>
      </g>
      <text x="30" y="60" font-size="20">✨</text>
      <text x="222" y="55" font-size="16">✨</text>
    </svg>
    <div class="label">わくわく</div>
    <div class="sub">出題時・耳が前向き</div>
  </div>

  <!-- ============ 3. せいかい! ============ -->
  <div class="card">
    <svg viewBox="0 0 280 260" class="bounce">
      <g>
        <polygon points="95,100 55,20 122,78" fill="#9A8579"/>
        <polygon points="95,92 70,38 110,74" fill="#E9B7BA"/>
      </g>
      <g>
        <polygon points="185,100 225,20 158,78" fill="#9A8579"/>
        <polygon points="185,92 210,38 170,74" fill="#E9B7BA"/>
      </g>
      <circle cx="140" cy="150" r="92" fill="#F6EFE6" stroke="#9A8579" stroke-width="1"/>
      <!-- 目(^ ^の弧) -->
      <path d="M92 150 Q108 132 124 150" fill="none" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
      <path d="M156 150 Q172 132 188 150" fill="none" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
      <!-- 頬ピンク -->
      <ellipse cx="90" cy="172" rx="14" ry="9" fill="#E9B7BA" opacity="0.75"/>
      <ellipse cx="190" cy="172" rx="14" ry="9" fill="#E9B7BA" opacity="0.75"/>
      <polygon points="133,176 147,176 140,185" fill="#E39AA0"/>
      <!-- 口(開けて笑う) -->
      <path d="M118 188 Q140 214 162 188 Q140 204 118 188 Z" fill="#B5645C"/>
      <path d="M118 188 Q140 214 162 188" fill="none" stroke="#9A8579" stroke-width="1.4"/>
      <g stroke="#c9bdb2" stroke-width="1">
        <line x1="95" y1="176" x2="40" y2="164"/>
        <line x1="95" y1="184" x2="38" y2="184"/>
        <line x1="95" y1="192" x2="42" y2="204"/>
        <line x1="185" y1="176" x2="240" y2="164"/>
        <line x1="185" y1="184" x2="242" y2="184"/>
        <line x1="185" y1="192" x2="238" y2="204"/>
      </g>
      <text x="220" y="90" font-size="18">🎉</text>
      <text x="35" y="200" font-size="14">🐾</text>
    </svg>
    <div class="label">せいかい！</div>
    <div class="sub">跳ねて喜ぶ</div>
  </div>

  <!-- ============ 4. おしい! ============ -->
  <div class="card">
    <svg viewBox="0 0 280 260">
      <g>
        <polygon points="95,100 55,20 122,78" fill="#9A8579"/>
        <polygon points="95,92 70,38 110,74" fill="#E9B7BA"/>
      </g>
      <g style="transform:rotate(28deg)" transform-origin="192 95">
        <polygon points="185,100 225,20 158,78" fill="#9A8579"/>
        <polygon points="185,92 210,38 170,74" fill="#E9B7BA"/>
      </g>
      <circle cx="140" cy="150" r="92" fill="#F6EFE6" stroke="#9A8579" stroke-width="1"/>
      <!-- 眉(下がる) -->
      <path d="M90 122 Q108 130 126 126" fill="none" stroke="#9A8579" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M154 126 Q172 130 190 122" fill="none" stroke="#9A8579" stroke-width="2.4" stroke-linecap="round"/>
      <!-- 目 -->
      <ellipse cx="108" cy="154" rx="13" ry="15" fill="#fff"/>
      <ellipse cx="108" cy="156" rx="10.5" ry="12" fill="#5D9CD6"/>
      <ellipse cx="108" cy="158" rx="4.5" ry="7" fill="#2b3a42"/>
      <ellipse cx="172" cy="154" rx="13" ry="15" fill="#fff"/>
      <ellipse cx="172" cy="156" rx="10.5" ry="12" fill="#5D9CD6"/>
      <ellipse cx="172" cy="158" rx="4.5" ry="7" fill="#2b3a42"/>
      <polygon points="133,180 147,180 140,189" fill="#E39AA0"/>
      <!-- 口(小さな弧) -->
      <path d="M122 200 Q140 192 158 200" fill="none" stroke="#9A8579" stroke-width="1.6" stroke-linecap="round"/>
      <g stroke="#c9bdb2" stroke-width="1">
        <line x1="95" y1="178" x2="42" y2="168"/>
        <line x1="95" y1="185" x2="40" y2="188"/>
        <line x1="95" y1="192" x2="44" y2="206"/>
        <line x1="185" y1="178" x2="238" y2="168"/>
        <line x1="185" y1="185" x2="240" y2="188"/>
        <line x1="185" y1="192" x2="236" y2="206"/>
      </g>
    </svg>
    <div class="label">おしい！</div>
    <div class="sub">寄り添う顔</div>
  </div>

  <!-- ============ 5. おねむ ============ -->
  <div class="card">
    <svg viewBox="0 0 280 260">
      <g style="transform:rotate(-4deg)" transform-origin="88 95">
        <polygon points="95,100 55,20 122,78" fill="#9A8579"/>
        <polygon points="95,92 70,38 110,74" fill="#E9B7BA"/>
      </g>
      <g style="transform:rotate(4deg)" transform-origin="192 95">
        <polygon points="185,100 225,20 158,78" fill="#9A8579"/>
        <polygon points="185,92 210,38 170,74" fill="#E9B7BA"/>
      </g>
      <circle cx="140" cy="150" r="92" fill="#F6EFE6" stroke="#9A8579" stroke-width="1"/>
      <!-- 目(閉じて弧) -->
      <path d="M94 152 Q108 162 122 152" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
      <path d="M158 152 Q172 162 186 152" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="90" cy="172" rx="12" ry="7" fill="#E9B7BA" opacity="0.5"/>
      <ellipse cx="190" cy="172" rx="12" ry="7" fill="#E9B7BA" opacity="0.5"/>
      <polygon points="133,178 147,178 140,187" fill="#E39AA0" opacity="0.85"/>
      <!-- 口(小さな丸) -->
      <ellipse cx="140" cy="196" rx="6" ry="5" fill="none" stroke="#9A8579" stroke-width="1.4"/>
      <g stroke="#c9bdb2" stroke-width="1">
        <line x1="95" y1="178" x2="42" y2="168"/>
        <line x1="95" y1="185" x2="40" y2="188"/>
        <line x1="185" y1="178" x2="238" y2="168"/>
        <line x1="185" y1="185" x2="240" y2="188"/>
      </g>
      <text x="205" y="70" font-size="18">💤</text>
    </svg>
    <div class="label">おねむ</div>
    <div class="sub">おやすみ中</div>
  </div>

</div>
</body>
</html>
