<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>オレ(au lait) 表情プレビュー</title>
<style>
  :root{
    --cream:#FFF8EE;
    --mint:#E4F5EE;
    --pale-blue:#EAF2FB;
    --ink:#5A4B42;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:24px;
    font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Yu Gothic",sans-serif;
    background:linear-gradient(160deg,var(--cream),var(--pale-blue) 60%,var(--mint));
    min-height:100vh;
    color:var(--ink);
  }
  h1{ text-align:center; font-size:1.4rem; margin:0 0 6px; }
  p.lead{ text-align:center; margin:0 0 24px; font-size:0.95rem; opacity:0.8; }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    max-width:1200px;
    margin:0 auto;
  }
  .card{
    background:#fff;
    border-radius:28px;
    padding:16px;
    text-align:center;
    box-shadow:0 6px 18px rgba(154,133,121,0.18);
  }
  .card svg{ width:100%; height:auto; max-width:220px; }
  .card .label{ margin-top:8px; font-weight:bold; font-size:1.05rem; }
  .card .sub{ font-size:0.8rem; opacity:0.65; }

  /* ===== まばたき ===== */
  @keyframes blink{
    0%,92%,100%{ transform:scaleY(1); }
    94%,97%{ transform:scaleY(0.08); }
  }
  .eye-group{ transform-origin:center; animation:blink 5s infinite; }
  .eye-group.eye2{ animation-delay:0.3s; }

  /* ===== ヒゲの微揺れ ===== */
  @keyframes whisker{
    0%,100%{ transform:rotate(0deg); }
    50%{ transform:rotate(2deg); }
  }
  .whiskers-left{ transform-origin:95px 165px; animation:whisker 3.2s ease-in-out infinite; }
  .whiskers-right{ transform-origin:185px 165px; animation:whisker 3.2s ease-in-out infinite reverse; }

  /* ===== 耳ぴくっ ===== */
  @keyframes earTwitch{
    0%,88%,100%{ transform:rotate(0deg); }
    90%{ transform:rotate(-6deg); }
    92%{ transform:rotate(3deg); }
    94%{ transform:rotate(0deg); }
  }
  .ear-left{ transform-origin:90px 100px; animation:earTwitch 6s infinite; }
  .ear-right{ transform-origin:190px 100px; animation:earTwitch 6s infinite 0.5s; }

  /* ===== せいかい:ぴょこん ===== */
  @keyframes bounce{
    0%,100%{ transform:translateY(0); }
    30%{ transform:translateY(-14px); }
    50%{ transform:translateY(2px); }
    70%{ transform:translateY(-6px); }
  }
  .bounce{ animation:bounce 0.7s ease-out infinite; }
</style>
</head>
<body>
<h1>🐾 オレ(au lait) 表情プレビュー v3</h1>
<p class="lead">耳を太く、目を大きく、口元を高い位置に描き直しました。まばたき・ヒゲの微揺れ・耳ぴくっが常時動いています。</p>

<div class="grid">

  <!-- ============ 1. つうじょう ============ -->
  <div class="card">
    <svg viewBox="0 0 280 260">
      <g class="ear-left">
        <polygon points="102,112 40,12 142,90" fill="#9A8579"/>
        <polygon points="100,100 62,38 122,82" fill="#E9B7BA"/>
      </g>
      <g class="ear-right">
        <polygon points="178,112 240,12 138,90" fill="#9A8579"/>
        <polygon points="180,100 218,38 158,82" fill="#E9B7BA"/>
      </g>
      <circle cx="140" cy="150" r="92" fill="#F6EFE6" stroke="#9A8579" stroke-width="1"/>
      <!-- 目(大きめ) -->
      <g class="eye-group eye1">
        <ellipse cx="100" cy="140" rx="26" ry="30" fill="#fff"/>
        <ellipse cx="100" cy="142" rx="21" ry="25" fill="#5D9CD6"/>
        <ellipse cx="100" cy="145" rx="8" ry="16" fill="#2b3a42"/>
        <circle cx="91" cy="128" r="5" fill="#fff"/>
      </g>
      <g class="eye-group eye2">
        <ellipse cx="180" cy="140" rx="26" ry="30" fill="#fff"/>
        <ellipse cx="180" cy="142" rx="21" ry="25" fill="#5D9CD6"/>
        <ellipse cx="180" cy="145" rx="8" ry="16" fill="#2b3a42"/>
        <circle cx="171" cy="128" r="5" fill="#fff"/>
      </g>
      <!-- 鼻 -->
      <polygon points="128,172 152,172 140,183" fill="#E39AA0"/>
      <!-- 口(W字・高め) -->
      <path d="M122 181 Q131 190 140 181 Q149 190 158 181" fill="none" stroke="#9A8579" stroke-width="1.8" stroke-linecap="round"/>
      <!-- ヒゲ -->
      <g class="whiskers-left" stroke="#c9bdb2" stroke-width="1">
        <line x1="95" y1="178" x2="42" y2="168"/>
        <line x1="95" y1="185" x2="40" y2="188"/>
        <line x1="95" y1="192" x2="44" y2="206"/>
      </g>
      <g class="whiskers-right" stroke="#c9bdb2" stroke-width="1">
        <line x1="185" y1="178" x2="238" y2="168"/>
        <line x1="185" y1="185" x2="240" y2="188"/>
        <line x1="185" y1="192" x2="236" y2="206"/>
      </g>
    </svg>
    <div class="label">つうじょう</div>
    <div class="sub">いつものオレ</div>
  </div>

  <!-- ============ 2. わくわく(出題時) ============ -->
  <div class="card">
    <svg viewBox="0 0 280 260">
      <g style="transform:rotate(-10deg)" transform-origin="90 100">
        <polygon points="102,112 40,12 142,90" fill="#9A8579"/>
        <polygon points="100,100 62,38 122,82" fill="#E9B7BA"/>
      </g>
      <g style="transform:rotate(10deg)" transform-origin="190 100">
        <polygon points="178,112 240,12 138,90" fill="#9A8579"/>
        <polygon points="180,100 218,38 158,82" fill="#E9B7BA"/>
      </g>
      <circle cx="140" cy="150" r="92" fill="#F6EFE6" stroke="#9A8579" stroke-width="1"/>
      <!-- 目(キラッと超大きめ) -->
      <ellipse cx="100" cy="138" rx="29" ry="33" fill="#fff"/>
      <ellipse cx="100" cy="140" rx="24" ry="28" fill="#5D9CD6"/>
      <ellipse cx="100" cy="144" rx="9" ry="17" fill="#2b3a42"/>
      <circle cx="90" cy="124" r="5.5" fill="#fff"/>
      <circle cx="108" cy="152" r="3" fill="#fff" opacity="0.85"/>
      <ellipse cx="180" cy="138" rx="29" ry="33" fill="#fff"/>
      <ellipse cx="180" cy="140" rx="24" ry="28" fill="#5D9CD6"/>
      <ellipse cx="180" cy="144" rx="9" ry="17" fill="#2b3a42"/>
      <circle cx="170" cy="124" r="5.5" fill="#fff"/>
      <circle cx="188" cy="152" r="3" fill="#fff" opacity="0.85"/>
      <polygon points="128,174 152,174 140,185" fill="#E39AA0"/>
      <!-- 口(少し開けて・高め) -->
      <path d="M124 183 Q140 195 156 183" fill="#B5645C"/>
      <path d="M124 183 Q140 195 156 183" fill="none" stroke="#9A8579" stroke-width="1.6"/>
      <g stroke="#c9bdb2" stroke-width="1">
        <line x1="95" y1="176" x2="40" y2="164"/>
        <line x1="95" y1="184" x2="38" y2="184"/>
        <line x1="95" y1="192" x2="42" y2="204"/>
        <line x1="185" y1="176" x2="240" y2="164"/>
        <line x1="185" y1="184" x2="242" y2="184"/>
        <line x1="185" y1="192" x2="238" y2="204"/>
      </g>
      <text x="26" y="55" font-size="20">✨</text>
      <text x="224" y="50" font-size="16">✨</text>
    </svg>
    <div class="label">わくわく</div>
    <div class="sub">出題時・耳が前向き</div>
  </div>

  <!-- ============ 3. せいかい! ============ -->
  <div class="card">
    <svg viewBox="0 0 280 260" class="bounce">
      <g>
        <polygon points="102,112 40,12 142,90" fill="#9A8579"/>
        <polygon points="100,100 62,38 122,82" fill="#E9B7BA"/>
      </g>
      <g>
        <polygon points="178,112 240,12 138,90" fill="#9A8579"/>
        <polygon points="180,100 218,38 158,82" fill="#E9B7BA"/>
      </g>
      <circle cx="140" cy="150" r="92" fill="#F6EFE6" stroke="#9A8579" stroke-width="1"/>
      <!-- 目(^ ^の弧・大きめ) -->
      <path d="M82 144 Q100 118 122 144" fill="none" stroke="#2b3a42" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M158 144 Q180 118 198 144" fill="none" stroke="#2b3a42" stroke-width="5.5" stroke-linecap="round"/>
      <!-- 頬ピンク -->
      <ellipse cx="85" cy="170" rx="15" ry="10" fill="#E9B7BA" opacity="0.75"/>
      <ellipse cx="195" cy="170" rx="15" ry="10" fill="#E9B7BA" opacity="0.75"/>
      <polygon points="128,172 152,172 140,183" fill="#E39AA0"/>
      <!-- 口(開けて笑う・高め&大きめ) -->
      <path d="M116 182 Q140 212 164 182 Q140 198 116 182 Z" fill="#B5645C"/>
      <path d="M116 182 Q140 212 164 182" fill="none" stroke="#9A8579" stroke-width="1.6"/>
      <g stroke="#c9bdb2" stroke-width="1">
        <line x1="95" y1="176" x2="40" y2="164"/>
        <line x1="95" y1="184" x2="38" y2="184"/>
        <line x1="95" y1="192" x2="42" y2="204"/>
        <line x1="185" y1="176" x2="240" y2="164"/>
        <line x1="185" y1="184" x2="242" y2="184"/>
        <line x1="185" y1="192" x2="238" y2="204"/>
      </g>
      <text x="220" y="90" font-size="18">🎉</text>
      <text x="35" y="200" font-size="14">🐾</text>
    </svg>
    <div class="label">せいかい！</div>
    <div class="sub">跳ねて喜ぶ</div>
  </div>

  <!-- ============ 4. おしい! ============ -->
  <div class="card">
    <svg viewBox="0 0 280 260">
      <g>
        <polygon points="102,112 40,12 142,90" fill="#9A8579"/>
        <polygon points="100,100 62,38 122,82" fill="#E9B7BA"/>
      </g>
      <g style="transform:rotate(28deg)" transform-origin="190 100">
        <polygon points="178,112 240,12 138,90" fill="#9A8579"/>
        <polygon points="180,100 218,38 158,82" fill="#E9B7BA"/>
      </g>
      <circle cx="140" cy="150" r="92" fill="#F6EFE6" stroke="#9A8579" stroke-width="1"/>
      <!-- 眉(下がる) -->
      <path d="M80 112 Q100 122 124 118" fill="none" stroke="#9A8579" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M156 118 Q180 122 200 112" fill="none" stroke="#9A8579" stroke-width="2.6" stroke-linecap="round"/>
      <!-- 目(大きめ) -->
      <ellipse cx="100" cy="145" rx="23" ry="27" fill="#fff"/>
      <ellipse cx="100" cy="148" rx="18.5" ry="21" fill="#5D9CD6"/>
      <ellipse cx="100" cy="151" rx="7" ry="13" fill="#2b3a42"/>
      <ellipse cx="180" cy="145" rx="23" ry="27" fill="#fff"/>
      <ellipse cx="180" cy="148" rx="18.5" ry="21" fill="#5D9CD6"/>
      <ellipse cx="180" cy="151" rx="7" ry="13" fill="#2b3a42"/>
      <polygon points="128,176 152,176 140,187" fill="#E39AA0"/>
      <!-- 口(小さな弧・高め) -->
      <path d="M120 195 Q140 187 160 195" fill="none" stroke="#9A8579" stroke-width="1.8" stroke-linecap="round"/>
      <g stroke="#c9bdb2" stroke-width="1">
        <line x1="95" y1="178" x2="42" y2="168"/>
        <line x1="95" y1="185" x2="40" y2="188"/>
        <line x1="95" y1="192" x2="44" y2="206"/>
        <line x1="185" y1="178" x2="238" y2="168"/>
        <line x1="185" y1="185" x2="240" y2="188"/>
        <line x1="185" y1="192" x2="236" y2="206"/>
      </g>
    </svg>
    <div class="label">おしい！</div>
    <div class="sub">寄り添う顔</div>
  </div>

  <!-- ============ 5. おねむ ============ -->
  <div class="card">
    <svg viewBox="0 0 280 260">
      <g style="transform:rotate(-4deg)" transform-origin="90 100">
        <polygon points="102,112 40,12 142,90" fill="#9A8579"/>
        <polygon points="100,100 62,38 122,82" fill="#E9B7BA"/>
      </g>
      <g style="transform:rotate(4deg)" transform-origin="190 100">
        <polygon points="178,112 240,12 138,90" fill="#9A8579"/>
        <polygon points="180,100 218,38 158,82" fill="#E9B7BA"/>
      </g>
      <circle cx="140" cy="150" r="92" fill="#F6EFE6" stroke="#9A8579" stroke-width="1"/>
      <!-- 目(閉じて弧・大きめ) -->
      <path d="M80 146 Q100 160 122 146" fill="none" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
      <path d="M158 146 Q180 160 200 146" fill="none" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="85" cy="172" rx="13" ry="8" fill="#E9B7BA" opacity="0.5"/>
      <ellipse cx="195" cy="172" rx="13" ry="8" fill="#E9B7BA" opacity="0.5"/>
      <polygon points="128,174 152,174 140,185" fill="#E39AA0" opacity="0.85"/>
      <!-- 口(小さな丸・高め) -->
      <ellipse cx="140" cy="192" rx="7" ry="6" fill="none" stroke="#9A8579" stroke-width="1.6"/>
      <g stroke="#c9bdb2" stroke-width="1">
        <line x1="95" y1="178" x2="42" y2="168"/>
        <line x1="95" y1="185" x2="40" y2="188"/>
        <line x1="185" y1="178" x2="238" y2="168"/>
        <line x1="185" y1="185" x2="240" y2="188"/>
      </g>
      <text x="205" y="70" font-size="18">💤</text>
    </svg>
    <div class="label">おねむ</div>
    <div class="sub">おやすみ中</div>
  </div>

</div>
</body>
</html>
