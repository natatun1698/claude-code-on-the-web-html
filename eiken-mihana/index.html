<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>オレとえいけん準2級</title>
<style>
  /* =========================================================
     ぜんたいの色・フォント設定(パステルカラー・角丸・広め余白)
  ========================================================= */
  :root{
    --cream:#FFF8EE;
    --mint:#E3F5EE;
    --pale-blue:#EAF2FB;
    --ink:#5A4B42;
    --accent:#5D9CD6;
    --accent-pink:#E9B7BA;
    --good:#7BC29A;
    --bad:#E3958C;
    --card:#FFFFFF;
    --shadow:0 8px 22px rgba(154,133,121,0.16);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; min-height:100vh;
    font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Rounded Mplus 1c","Yu Gothic",sans-serif;
    background:linear-gradient(160deg,var(--cream),var(--pale-blue) 55%,var(--mint));
    color:var(--ink);
  }
  ruby rt{ font-size:0.55em; opacity:0.8; }
  button{ font-family:inherit; cursor:pointer; }

  /* ヘッダー */
  header{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px;
    background:rgba(255,248,238,0.9);
    backdrop-filter:blur(4px);
    border-bottom:2px solid #f0e4d6;
  }
  header h1{
    font-size:clamp(1rem,3vw,1.3rem);
    margin:0;
    display:flex; align-items:center; gap:6px;
  }
  .toggles{ display:flex; gap:8px; }
  .toggle-btn{
    border:none; border-radius:999px; padding:8px 12px;
    background:#fff; box-shadow:var(--shadow);
    font-size:1.1rem; line-height:1;
    display:flex; align-items:center; gap:4px;
    color:var(--ink);
  }
  .toggle-btn[data-on="false"]{ opacity:0.45; }

  main{
    max-width:760px; margin:0 auto; padding:18px 14px 60px;
  }

  [hidden]{ display:none !important; }

  /* =========================================================
     オレ(au lait)のSVGステージ
  ========================================================= */
  .ore-wrap{ display:flex; justify-content:center; margin:6px 0 10px; }
  .ore{ width:150px; max-width:38vw; position:relative; }
  .ore svg{ width:100%; height:auto; display:none; }
  .ore[data-expr="normal"] .expr-normal{ display:block; }
  .ore[data-expr="wakuwaku"] .expr-wakuwaku{ display:block; }
  .ore[data-expr="seikai"] .expr-seikai{ display:block; }
  .ore[data-expr="oshii"] .expr-oshii{ display:block; }
  .ore[data-expr="onemu"] .expr-onemu{ display:block; }

  @keyframes blink{
    0%,92%,100%{ transform:scaleY(1); }
    94%,97%{ transform:scaleY(0.08); }
  }
  .eye-group{ transform-origin:center; animation:blink 5s infinite; }
  .eye-group.eye2{ animation-delay:0.3s; }
  @keyframes whisker{
    0%,100%{ transform:rotate(0deg); }
    50%{ transform:rotate(2deg); }
  }
  .whiskers-left{ transform-origin:95px 165px; animation:whisker 3.2s ease-in-out infinite; }
  .whiskers-right{ transform-origin:185px 165px; animation:whisker 3.2s ease-in-out infinite reverse; }
  @keyframes earTwitch{
    0%,88%,100%{ transform:rotate(0deg); }
    90%{ transform:rotate(-6deg); }
    92%{ transform:rotate(3deg); }
    94%{ transform:rotate(0deg); }
  }
  .ear-left{ transform-origin:90px 100px; animation:earTwitch 6s infinite; }
  .ear-right{ transform-origin:190px 100px; animation:earTwitch 6s infinite 0.5s; }
  @keyframes bounce{
    0%,100%{ transform:translateY(0); }
    30%{ transform:translateY(-14px); }
    50%{ transform:translateY(2px); }
    70%{ transform:translateY(-6px); }
  }
  .bounce{ animation:bounce 0.7s ease-out 2; }

  .ore-line{
    text-align:center; font-size:0.98rem; min-height:1.4em;
    margin-bottom:14px; font-weight:bold;
  }

  /* =========================================================
     カード共通
  ========================================================= */
  .card{
    background:var(--card); border-radius:26px; padding:20px;
    box-shadow:var(--shadow); margin-bottom:16px;
  }

  /* スタート画面 */
  .mode-grid{
    display:grid; grid-template-columns:1fr; gap:14px;
  }
  .mode-btn{
    display:flex; align-items:center; gap:14px;
    border:none; border-radius:22px; padding:18px 20px;
    background:linear-gradient(135deg,#fff,var(--pale-blue));
    box-shadow:var(--shadow); text-align:left;
    font-size:1.05rem; color:var(--ink);
  }
  .mode-btn .emoji{ font-size:1.8rem; }
  .mode-btn small{ display:block; font-weight:normal; opacity:0.7; font-size:0.8rem; margin-top:2px; }
  .review-btn{
    margin-top:6px; border:2px dashed var(--accent-pink);
    background:#fff;
  }
  .review-btn[disabled]{ opacity:0.4; cursor:not-allowed; }

  /* 進捗バー */
  .progress-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .progress-bar{
    flex:1; height:14px; border-radius:999px; background:#eee2d6; overflow:hidden;
  }
  .progress-bar > div{
    height:100%; background:linear-gradient(90deg,var(--accent),var(--good));
    border-radius:999px; transition:width 0.3s ease;
  }
  .progress-label{ font-size:0.8rem; white-space:nowrap; opacity:0.75; }
  .combo-badge{
    display:inline-block; margin-left:6px; padding:2px 10px; border-radius:999px;
    background:#FFE9A8; font-size:0.8rem; font-weight:bold; color:#8a6d1a;
  }

  /* 問題文 */
  .question-sentence{
    font-size:clamp(1.05rem,3.6vw,1.25rem); line-height:1.7; white-space:pre-line;
    margin-bottom:16px; text-align:center;
  }
  .choices{
    display:grid; grid-template-columns:1fr; gap:10px;
  }
  .choice-btn{
    border:2px solid #e9ddd0; border-radius:18px; padding:14px 16px;
    background:#fff; font-size:1rem; text-align:left; color:var(--ink);
    transition:transform 0.1s ease;
  }
  .choice-btn:active{ transform:scale(0.97); }
  .choice-btn.correct{ background:#E7F6EC; border-color:var(--good); font-weight:bold; }
  .choice-btn.wrong{ background:#FBEAE8; border-color:var(--bad); }
  .choice-btn[disabled]{ pointer-events:none; }

  .explain-box{
    margin-top:16px; padding:16px; border-radius:18px;
    background:var(--pale-blue); font-size:0.95rem; line-height:1.7;
  }
  .explain-box.wrong-tone{ background:#FFF3EF; }
  .next-btn, .primary-btn{
    display:block; width:100%; margin-top:14px; border:none; border-radius:999px;
    padding:14px; font-size:1.05rem; font-weight:bold; color:#fff;
    background:linear-gradient(135deg,var(--accent),#7fb8e6);
    box-shadow:var(--shadow);
  }
  .secondary-btn{
    display:block; width:100%; margin-top:10px; border:2px solid var(--accent);
    border-radius:999px; padding:12px; font-size:1rem; font-weight:bold;
    background:#fff; color:var(--accent);
  }

  /* にぼしポイント演出 */
  .niboshi-pop{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(90,75,66,0.35); z-index:50;
  }
  .niboshi-card{
    background:#fff; border-radius:26px; padding:28px 30px; text-align:center;
    box-shadow:var(--shadow); animation:popIn 0.35s ease;
  }
  @keyframes popIn{
    0%{ transform:scale(0.6); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }

  /* 紙吹雪・肉球 */
  .fx-layer{ position:fixed; inset:0; pointer-events:none; z-index:40; overflow:hidden; }
  .confetti, .paw{
    position:absolute; top:-30px; font-size:1.4rem;
    animation:fall 1.1s ease-in forwards;
  }
  @keyframes fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(70vh) rotate(280deg); opacity:0; }
  }

  /* 結果画面 */
  .result-score{ text-align:center; font-size:2.4rem; font-weight:bold; color:var(--accent); }
  .result-sub{ text-align:center; margin-bottom:14px; }
  .mistake-item{
    border-top:1px dashed #e6dacb; padding:12px 0; font-size:0.92rem;
  }
  .mistake-item .q{ font-weight:bold; margin-bottom:4px; }
  .mistake-item .a{ color:var(--good); font-weight:bold; }

  /* 英作文モード */
  .essay-block{ margin-bottom:10px; }
  .essay-original{
    background:var(--mint); border-radius:16px; padding:14px; font-size:0.95rem;
    line-height:1.7; margin:10px 0; white-space:pre-line;
  }
  .essay-template{ font-size:0.9rem; color:#7a6a5e; margin:4px 0; }
  textarea.essay-input{
    width:100%; min-height:130px; border-radius:16px; border:2px solid #e9ddd0;
    padding:12px; font-size:1rem; font-family:inherit; resize:vertical;
  }
  .wordcount{ text-align:right; font-size:0.8rem; opacity:0.7; margin-top:4px; }
  .model-answer{
    background:#fff; border:2px solid var(--pale-blue); border-radius:16px; padding:14px;
    margin-top:6px; font-size:0.95rem; line-height:1.7;
  }
  .self-score-row{ display:flex; gap:8px; margin-top:12px; }
  .self-score-row button{
    flex:1; border:none; border-radius:14px; padding:10px; font-size:1rem;
    background:#fff; box-shadow:var(--shadow);
  }
  .self-score-row button.picked{ background:var(--accent); color:#fff; }

  @media (min-width:520px){
    .mode-grid{ grid-template-columns:1fr 1fr; }
    .mode-btn.review-btn{ grid-column:1 / -1; }
  }
</style>
</head>

  <!-- ============================================================
       スタート画面
  ============================================================= -->
  <section id="screen-start">
    <div class="card">
      <div class="mode-grid">
        <button class="mode-btn" data-mode="vocab">
          <span class="emoji">🔤</span>
          <span>4たくクイズ<small>かっこにあう ことばを 4つから えらぶよ</small></span>
        </button>
        <button class="mode-btn" data-mode="conversation">
          <span class="emoji">💬</span>
          <span>かいわ文<small>会話のつづきを えらぶよ</small></span>
        </button>
        <button class="mode-btn" data-mode="essay">

        </button>
        <button class="mode-btn review-btn" id="btn-review" data-mode="review" disabled>
          <span class="emoji">🐾</span>
          <span>にがて問題を<ruby>復習<rt>ふくしゅう</rt></ruby><small id="review-count">まだ にがて問題は ないよ</small></span>

    </div>
  </section>

  <!-- ============================================================
       クイズ画面(4たくクイズ・かいわ文・にがて復習で共通つかいまわし)
  ============================================================= -->

    <div class="progress-row">
      <div class="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
      <div class="progress-label"><span id="progress-label">0/10もん</span><span class="combo-badge" id="combo-badge" hidden></span></div>

  <!-- ============================================================
       えい作文画面
  ============================================================= -->
  <section id="screen-essay" hidden>
    <div class="progress-row">
      <div class="progress-bar"><div id="essay-progress-fill" style="width:0%"></div></div>
      <div class="progress-label" id="essay-progress-label">1/2もん</div>
    </div>
    <div class="card essay-block">
      <div id="essay-intro" style="font-size:0.9rem;line-height:1.7;"></div>
      <div class="essay-original" id="essay-original"></div>
      <div class="essay-template" id="essay-template-open"></div>
      <textarea class="essay-input" id="essay-textarea" placeholder="ここに えい文を かいてみよう"></textarea>
      <div class="wordcount" id="essay-wordcount">0ご</div>
      <div class="essay-template" id="essay-template-close"></div>

        <div class="model-answer" id="essay-model"></div>

        <p style="font-size:0.9rem;text-align:center;margin-top:10px;">じぶんの かいとうを 見て、じこさいてんしてみよう</p>
        <div class="self-score-row">
          <button data-score="good">◎ よくできた</button>
          <button data-score="soso">△ おしい</button>
          <button data-score="bad">✕ もういちど</button>
        </div>
      </div>
      <button class="next-btn" id="btn-essay-next" hidden>つぎへ ▶</button>
    </div>
  </section>

  <!-- ============================================================
       結果画面
  ============================================================= -->
  <section id="screen-result" hidden>
    <div class="card">
      <div class="result-score" id="result-score">0%</div>
      <div class="result-sub" id="result-sub"></div>
      <div id="result-mistakes"></div>
    </div>
    <button class="primary-btn" id="btn-retry">もういちど おなじモード</button>
    <button class="secondary-btn" id="btn-back-start">モードせんたくに もどる</button>
  </section>

</main>

<div class="fx-layer" id="fx-layer"></div>

<script src="questions.js"></script>
<script src="answers.js"></script>
<script>
/* =============================================================
   えいけん準2級 学習アプリ 本体スクリプト
   (キャラクター「オレ(au lait)」まわりの演出・音・進行管理)
============================================================= */

/* ---------- データのインデックス化 ---------- */
const QUESTION_MAP = {};
QUESTIONS.forEach(q => QUESTION_MAP[q.id] = q);
const ANSWER_MAP = {};
ANSWERS.forEach(a => ANSWER_MAP[a.id] = a);

const VOCAB_POOL = QUESTIONS.filter(q => q.type === 'vocab');
const CONV_POOL  = QUESTIONS.filter(q => q.type === 'conversation');
const ESSAY_POOL = QUESTIONS.filter(q => q.type === 'email' || q.type === 'opinion');

/* ---------- localStorage まわり ---------- */
const LS = {
  sound: 'eikenMihana_soundOn',
  bgm: 'eikenMihana_bgmOn',
  mistakes: 'eikenMihana_mistakes'
};
function loadBool(key, defaultVal){
  const v = localStorage.getItem(key);
  if(v === null) return defaultVal;
  return v === 'true';
}
function saveBool(key, val){ localStorage.setItem(key, val ? 'true' : 'false'); }
function loadMistakes(){
  try{ return JSON.parse(localStorage.getItem(LS.mistakes) || '[]'); }catch(e){ return []; }
}
function saveMistakes(list){ localStorage.setItem(LS.mistakes, JSON.stringify(list)); }
function addMistake(id){
  const list = loadMistakes();
  if(!list.includes(id)){ list.push(id); saveMistakes(list); }
}

const settings = {
  sound: loadBool(LS.sound, true),
  bgm: loadBool(LS.bgm, false)
};

/* =============================================================
   Web Audio API による効果音・BGM合成(音声ファイルは一切つかわない)
============================================================= */
const SoundEngine = (() => {
  let ctx = null;
  let bgmTimer = null;
  let bgmPlaying = false;

  function getCtx(){
    if(!ctx){ ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    if(ctx.state === 'suspended'){ ctx.resume(); }
    return ctx;
  }

  function tone(freq, start, dur, type, peak){
    const c = getCtx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    const t0 = c.currentTime + start;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(peak, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  function click(){
    if(!settings.sound) return;
    tone(1250, 0, 0.05, 'square', 0.06);
  }
  function correct(){
    if(!settings.sound) return;
    [523.25, 659.25, 783.99, 1046.5].forEach((f,i) => tone(f, i*0.09, 0.2, 'sine', 0.18));
  }
  function incorrect(){
    if(!settings.sound) return;
    tone(392.0, 0, 0.28, 'triangle', 0.14);
    tone(311.1, 0.16, 0.32, 'triangle', 0.12);
  }
  function combo(){
    if(!settings.sound) return;
    [1046.5, 1318.5, 1568.0, 2093.0].forEach((f,i) => tone(f, i*0.05, 0.14, 'sine', 0.13));
  }
  function fanfare(){
    if(!settings.sound) return;
    [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5].forEach((f,i) => tone(f, i*0.16, 0.32, 'triangle', 0.17));
  }

  // ゆったりループのシンプルなBGMメロディ(sine/triangle中心)
  const MELODY = [
    {f:523.25,d:0.5},{f:587.33,d:0.5},{f:659.25,d:0.5},{f:523.25,d:0.5},
    {f:659.25,d:0.5},{f:698.46,d:0.5},{f:783.99,d:1.0},
    {f:659.25,d:0.5},{f:587.33,d:0.5},{f:523.25,d:1.0}
  ];
  function scheduleBgmStep(i){
    if(!bgmPlaying) return;
    const note = MELODY[i % MELODY.length];
    if(settings.bgm){
      tone(note.f, 0, note.d*0.9, 'triangle', 0.05);
    }
    bgmTimer = setTimeout(() => scheduleBgmStep(i+1), note.d*1000);
  }
  function startBgm(){
    if(bgmPlaying) return;
    bgmPlaying = true;
    getCtx();
    scheduleBgmStep(0);
  }
  function stopBgm(){
    bgmPlaying = false;
    if(bgmTimer){ clearTimeout(bgmTimer); bgmTimer = null; }
  }

  return { getCtx, click, correct, incorrect, combo, fanfare, startBgm, stopBgm };
})();

/* ---------- 音・BGMトグルボタン ---------- */
const btnSound = document.getElementById('btn-sound');
const btnBgm = document.getElementById('btn-bgm');
function refreshToggleUI(){
  btnSound.dataset.on = settings.sound;
  btnBgm.dataset.on = settings.bgm;
}
btnSound.addEventListener('click', () => {
  SoundEngine.getCtx();
  settings.sound = !settings.sound;
  saveBool(LS.sound, settings.sound);
  refreshToggleUI();
  if(settings.sound) SoundEngine.click();
});
btnBgm.addEventListener('click', () => {
  SoundEngine.getCtx();
  settings.bgm = !settings.bgm;
  saveBool(LS.bgm, settings.bgm);
  refreshToggleUI();
  if(settings.bgm){ SoundEngine.startBgm(); } else { SoundEngine.stopBgm(); }
});
refreshToggleUI();
// 起動時にBGM設定がONだった場合も、初回タップまでは鳴らさない(自動再生制限のため)
document.addEventListener('click', function firstTap(){
  if(settings.bgm){ SoundEngine.startBgm(); }
  document.removeEventListener('click', firstTap);
}, { once:true });

/* =============================================================
   オレ(au lait)の表情・セリフ
============================================================= */
const oreEl = document.getElementById('ore');
const oreLineEl = document.getElementById('ore-line');
function setOreExpr(expr){ oreEl.dataset.expr = expr; }
function setOreLine(text){ oreLineEl.textContent = text; }

const PRAISES = [
  'みはなちゃん、すごい！', 'さすが みはなちゃんだニャ！', 'やったね、みはなちゃん！',
  'その ちょうし！かんぺきだニャ', 'みはなちゃん、天才かも！', 'ボク、びっくりしちゃった！',
  'すばらしい！その調子だニャ', 'みはなちゃんなら できると思ってた！', 'ナイス こたえ！',
  'キラキラ かがやいてるニャ', 'みはなちゃん、かっこいい！', 'ばっちりだね！'
];
const COMFORTS = [
  'おしい！いっしょに 見てみようね', 'だいじょうぶ、つぎ いこう！', 'ここは ちょっと むずかしいね',
  'ボクも まちがえること あるニャ', 'いっしょに おぼえようね', 'つぎは きっと できるよ'
];
function randomFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* =============================================================
   紙吹雪・肉球エフェクト
============================================================= */
const fxLayer = document.getElementById('fx-layer');
function spawnFx(kind, count){
  const emojis = kind === 'confetti' ? ['🎉','✨','🎊','⭐'] : ['🐾'];
  for(let i=0;i<count;i++){
    const span = document.createElement('span');
    span.className = kind === 'confetti' ? 'confetti' : 'paw';
    span.textContent = randomFrom(emojis);
    span.style.left = Math.random()*100 + 'vw';
    span.style.animationDelay = (Math.random()*0.3) + 's';
    span.style.fontSize = (1 + Math.random()*1.2) + 'rem';
    fxLayer.appendChild(span);
    setTimeout(() => span.remove(), 1500);
  }
}

/* =============================================================
   セッション管理(4たくクイズ・かいわ文・にがて復習)
============================================================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

let session = null; // {mode, ids:[...], index, correctCount, wrongIds:[...], combo}

function poolForMode(mode){
  if(mode === 'vocab') return VOCAB_POOL;
  if(mode === 'conversation') return CONV_POOL;
  if(mode === 'review'){
    const ids = loadMistakes();
    return ids.map(id => QUESTION_MAP[id]).filter(q => q && (q.type==='vocab' || q.type==='conversation'));
  }
  return [];
}

function startQuizSession(mode){
  const pool = shuffle(poolForMode(mode));
  const total = Math.min(10, pool.length);
  session = {
    mode,
    ids: pool.slice(0, total).map(q => q.id),
    index: 0,
    correctCount: 0,
    wrongIds: [],
    combo: 0,
    maxCombo: 0
  };
  showScreen('quiz');
  setOreExpr('wakuwaku');
  setOreLine('じゃあ、はじめるよ！');
  renderQuestion();
}

function currentQuestion(){ return QUESTION_MAP[session.ids[session.index]]; }

function renderQuestion(){
  const q = currentQuestion();
  const total = session.ids.length;
  document.getElementById('progress-fill').style.width = Math.round((session.index/total)*100) + '%';
  document.getElementById('progress-label').textContent = (session.index+1) + '/' + total + 'もん';
  const comboBadge = document.getElementById('combo-badge');
  if(session.combo >= 2){
    comboBadge.hidden = false;
    comboBadge.textContent = session.combo + 'れんぞく！';
  } else {
    comboBadge.hidden = true;
  }
  setOreExpr('wakuwaku');
  document.getElementById('question-sentence').textContent = q.sentence;
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  q.choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = (i+1) + '. ' + choice;
    btn.addEventListener('click', () => handleAnswer(i+1, btn));
    choicesEl.appendChild(btn);
  });
  document.getElementById('explain-box').hidden = true;
  document.getElementById('btn-next').hidden = true;
}

function handleAnswer(selected, btnEl){
  SoundEngine.click();
  const q = currentQuestion();
  const ans = ANSWER_MAP[q.id];
  const isCorrect = selected === ans.correct;
  const allBtns = document.querySelectorAll('#choices .choice-btn');
  allBtns.forEach((b, i) => {
    b.disabled = true;
    if(i+1 === ans.correct) b.classList.add('correct');
    if(i+1 === selected && !isCorrect) b.classList.add('wrong');
  });

  if(isCorrect){
    session.correctCount++;
    session.combo++;
    session.maxCombo = Math.max(session.maxCombo, session.combo);
    setOreExpr('seikai');
    setOreLine(randomFrom(PRAISES));
    spawnFx('confetti', 14);
    spawnFx('paw', 6);
    if(session.combo >= 3){ SoundEngine.combo(); } else { SoundEngine.correct(); }
  } else {
    session.combo = 0;
    session.wrongIds.push(q.id);
    addMistake(q.id);
    setOreExpr('oshii');
    setOreLine(randomFrom(COMFORTS));
    SoundEngine.incorrect();
  }

  const explainEl = document.getElementById('explain-box');
  explainEl.hidden = false;
  explainEl.className = 'explain-box' + (isCorrect ? '' : ' wrong-tone');
  explainEl.innerHTML = ans.explanationJa;
  document.getElementById('btn-next').hidden = false;

  // 5問ごとの「にぼしポイント」ごほうび演出
  if((session.index+1) % 5 === 0){
    setTimeout(showNiboshiReward, 600);
  }
}

function showNiboshiReward(){
  const pop = document.createElement('div');
  pop.className = 'niboshi-pop';
  pop.innerHTML = '<div class="niboshi-card">🐟🐟🐟<br><b>にぼしポイント ゲット！</b><br>もう ' + (session.index+1) + 'もん がんばったね</div>';
  document.body.appendChild(pop);
  SoundEngine.combo();
  setTimeout(() => pop.remove(), 1400);
}

document.getElementById('btn-next').addEventListener('click', () => {
  SoundEngine.click();
  session.index++;
  if(session.index >= session.ids.length){
    finishQuizSession();
  } else {
    renderQuestion();
  }
});

function finishQuizSession(){
  const total = session.ids.length;
  const accuracy = total ? Math.round((session.correctCount/total)*100) : 0;
  document.getElementById('progress-fill').style.width = '100%';
  showScreen('result');
  document.getElementById('result-score').textContent = accuracy + '%';
  document.getElementById('result-sub').textContent = total + 'もん中 ' + session.correctCount + 'もん せいかい(さいだいコンボ ' + session.maxCombo + ')';

  if(accuracy >= 80){ setOreExpr('seikai'); setOreLine('すごい！みはなちゃん、天才だニャ！'); SoundEngine.fanfare(); }
  else if(accuracy >= 50){ setOreExpr('normal'); setOreLine('よくがんばったね！つぎも いっしょにがんばろう'); SoundEngine.fanfare(); }
  else { setOreExpr('oshii'); setOreLine('だいじょうぶ、まちがえた問題は また いっしょに 見てみようね'); SoundEngine.fanfare(); }

  const wrapEl = document.getElementById('result-mistakes');
  wrapEl.innerHTML = '';
  if(session.wrongIds.length === 0){
    wrapEl.innerHTML = '<p style="text-align:center;">ぜんもん せいかい！すごいよ、みはなちゃん！</p>';
  } else {
    session.wrongIds.forEach(id => {
      const q = QUESTION_MAP[id];
      const ans = ANSWER_MAP[id];
      const div = document.createElement('div');
      div.className = 'mistake-item';
      div.innerHTML = '<div class="q">' + q.sentence.replace(/\n/g,'<br>') + '</div>'
        + '<div class="a">せいかい: ' + q.choices[ans.correct-1] + '</div>'
        + '<div>' + ans.explanationJa + '</div>';
      wrapEl.appendChild(div);
    });
  }
  updateReviewButton();
}

/* =============================================================
   えい作文モード
============================================================= */
let essayIndex = 0;
let essayIds = [];

function startEssaySession(){
  essayIds = shuffle(ESSAY_POOL).map(q => q.id);
  essayIndex = 0;
  showScreen('essay');
  setOreExpr('wakuwaku');
  setOreLine('じっくり かんがえて かいてみよう！');
  renderEssay();
}

function renderEssay(){
  const q = QUESTION_MAP[essayIds[essayIndex]];
  const ans = ANSWER_MAP[q.id];
  document.getElementById('essay-progress-fill').style.width = Math.round((essayIndex/essayIds.length)*100) + '%';
  document.getElementById('essay-progress-label').textContent = (essayIndex+1) + '/' + essayIds.length + 'もん';

  document.getElementById('essay-intro').textContent = q.intro;
  const originalEl = document.getElementById('essay-original');
  const openEl = document.getElementById('essay-template-open');
  const closeEl = document.getElementById('essay-template-close');

  if(q.type === 'email'){
    const o = q.originalEmail;
    originalEl.textContent = o.greeting + '\n\n' + o.body + '\n\n' + o.closing + '\n' + o.signature;
    openEl.textContent = q.replyTemplate.greeting + '　' + q.replyTemplate.opening;
    closeEl.textContent = q.replyTemplate.closing;
  } else {
    originalEl.textContent = 'QUESTION\n' + q.question;
    openEl.textContent = '';
    closeEl.textContent = '';
  }

  const ta = document.getElementById('essay-textarea');
  ta.value = '';
  updateWordCount();
  document.getElementById('essay-model-wrap').hidden = true;
  document.getElementById('btn-show-model').hidden = false;
  document.getElementById('btn-essay-next').hidden = true;

  const modelEl = document.getElementById('essay-model');
  modelEl.innerHTML = ans.modelAnswers.map((m,i) =>
    '<p><b>かいとうれい' + (i+1) + '(' + m.wordCount + 'ご)</b><br>' + m.text + '</p>'
  ).join('');
  document.getElementById('essay-explain').innerHTML = ans.explanationJa;

  document.querySelectorAll('.self-score-row button').forEach(b => b.classList.remove('picked'));
}

function updateWordCount(){
  const ta = document.getElementById('essay-textarea');
  const words = ta.value.trim().length ? ta.value.trim().split(/\s+/).length : 0;
  document.getElementById('essay-wordcount').textContent = words + 'ご';
}
document.getElementById('essay-textarea').addEventListener('input', updateWordCount);

document.getElementById('btn-show-model').addEventListener('click', () => {
  SoundEngine.click();
  document.getElementById('essay-model-wrap').hidden = false;
  document.getElementById('btn-show-model').hidden = true;
  document.getElementById('btn-essay-next').hidden = false;
  setOreExpr('normal');
  setOreLine('じぶんの こたえと くらべてみてね');
});

document.querySelectorAll('.self-score-row button').forEach(btn => {
  btn.addEventListener('click', () => {
    SoundEngine.click();
    document.querySelectorAll('.self-score-row button').forEach(b => b.classList.remove('picked'));
    btn.classList.add('picked');
    if(btn.dataset.score === 'good'){ setOreExpr('seikai'); setOreLine(randomFrom(PRAISES)); spawnFx('confetti', 10); }
    else if(btn.dataset.score === 'bad'){ setOreExpr('oshii'); setOreLine(randomFrom(COMFORTS)); }
    else { setOreExpr('normal'); setOreLine('つぎも がんばろうね'); }
  });
});

document.getElementById('btn-essay-next').addEventListener('click', () => {
  SoundEngine.click();
  essayIndex++;
  if(essayIndex >= essayIds.length){
    document.getElementById('essay-progress-fill').style.width = '100%';
    showScreen('result');
    document.getElementById('result-score').textContent = '✍️';
    document.getElementById('result-sub').textContent = 'えい作文モード、ぜんもん おわり！';
    document.getElementById('result-mistakes').innerHTML = '<p style="text-align:center;">じぶんの かいとうと くらべて、たくさん かけたね！</p>';
    setOreExpr('seikai');
    setOreLine('よく がんばったね、みはなちゃん！');
    SoundEngine.fanfare();
  } else {
    renderEssay();
  }
});

/* =============================================================
   画面切り替え・スタート画面
============================================================= */
function showScreen(name){
  ['start','quiz','essay','result'].forEach(n => {
    document.getElementById('screen-' + n).hidden = (n !== name);
  });
}

function updateReviewButton(){
  const mistakes = loadMistakes();
  const btn = document.getElementById('btn-review');
  const countEl = document.getElementById('review-count');
  if(mistakes.length > 0){
    btn.disabled = false;
    countEl.textContent = 'いま ' + mistakes.length + 'もん あるよ';
  } else {
    btn.disabled = true;
    countEl.textContent = 'まだ にがて問題は ないよ';
  }
}
updateReviewButton();

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    SoundEngine.getCtx();
    SoundEngine.click();
    const mode = btn.dataset.mode;
    if(mode === 'essay'){ startEssaySession(); }
    else { startQuizSession(mode); }
  });
});

document.getElementById('btn-retry').addEventListener('click', () => {
  SoundEngine.click();
  if(session && session.mode){ startQuizSession(session.mode); }
  else { startEssaySession(); }
});
document.getElementById('btn-back-start').addEventListener('click', () => {
  SoundEngine.click();
  showScreen('start');
  setOreExpr('normal');
  setOreLine('つぎは どれに ちょうせんする？');
  updateReviewButton();
});

showScreen('start');
</script>
</body>
