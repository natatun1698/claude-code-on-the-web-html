<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 270" width="620" height="270" role="img" aria-label="図1は長方形ABCDと点P・点Q。図2は三角形APQの面積と時間のグラフで、30秒のとき面積が2100cm²">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#222"/>
    </marker>
  </defs>
  <g font-size="15" fill="#222">
    <text x="12" y="22" font-weight="bold">図1</text>
    <rect x="40" y="40" width="220" height="170" fill="#fff" stroke="#222" stroke-width="2"/>
    <text x="22" y="40">A</text>
    <text x="266" y="40">D</text>
    <text x="22" y="226">B</text>
    <text x="266" y="226">C</text>
    <circle cx="40" cy="105" r="5" fill="#222"/>
    <text x="18" y="110">P</text>
    <line x1="52" y1="95" x2="52" y2="132" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>
    <circle cx="260" cy="160" r="5" fill="#222"/>
    <text x="270" y="165">Q</text>
    <line x1="248" y1="172" x2="248" y2="132" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="150" y="246" text-anchor="middle">70cm</text>

    <text x="320" y="22" font-weight="bold">図2</text>
    <text x="330" y="40" font-size="13">面積(cm²)</text>
    <line x1="360" y1="215" x2="360" y2="50" stroke="#222" stroke-width="1.8"/>
    <line x1="360" y1="215" x2="590" y2="215" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>
    <polyline points="360,215 475,80 590,215" fill="none" stroke="#222" stroke-width="2.2"/>
    <line x1="360" y1="80" x2="475" y2="80" stroke="#222" stroke-width="1.3" stroke-dasharray="5 4"/>
    <line x1="475" y1="80" x2="475" y2="215" stroke="#222" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="318" y="85">2100</text>
    <text x="344" y="232">0</text>
    <text x="466" y="234">30</text>
    <text x="552" y="240" font-size="13">時間(秒)</text>
  </g>
</svg>
