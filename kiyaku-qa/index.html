<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>医療機器業公正競争規約Q&A — 規約チャットボット</title>
  <meta name="description" content="医療機器業公正競争規約(公正取引協議会)に関する質問に、根拠条文つきで答えるチャットボット。贈答・接待・貸出し・立会い・サンプル・寄付の可否をすぐ確認。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>" />
  <style>
    :root {
      --bg: #f4f6fa;
      --panel: #ffffff;
      --ink: #1e2a38;
      --sub: #5a6b7e;
      --accent: #0f5fa8;
      --accent-soft: #e3eefb;
      --user: #0f5fa8;
      --ok: #1a7f4e;
      --ng: #c0392b;
      --cond: #b06f00;
      --info: #46617e;
      --border: #dde4ee;
      --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
      background: var(--bg); color: var(--ink);
      display: flex; flex-direction: column;
      max-width: 860px; margin: 0 auto;
      height: 100dvh;
    }
    header.app-header {
      padding: 14px 16px 10px;
      background: linear-gradient(135deg, #0d4c86, #1173c8);
      color: #fff;
      border-radius: 0 0 var(--radius) var(--radius);
      flex: none;
    }
    header.app-header h1 { font-size: 1.05rem; line-height: 1.4; }
    header.app-header .subtitle { font-size: 0.72rem; opacity: 0.9; margin-top: 2px; }
    .quick-chips {
      display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px 4px;
      -webkit-overflow-scrolling: touch; flex: none; scrollbar-width: none;
    }
    .quick-chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; border: 1px solid var(--border); background: var(--panel);
      color: var(--accent); font-size: 0.78rem; padding: 7px 12px;
      border-radius: 999px; cursor: pointer; white-space: nowrap;
    }
    .chip:active { background: var(--accent-soft); }
    .chip-small { font-size: 0.72rem; padding: 5px 10px; margin: 3px 4px 0 0; }
    #chat-log {
      flex: 1 1 auto; overflow-y: auto; padding: 10px 12px 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg { display: flex; }
    .msg.user { justify-content: flex-end; }
    .msg .bubble {
      max-width: 92%; padding: 10px 12px; border-radius: var(--radius);
      font-size: 0.88rem; line-height: 1.65;
    }
    .msg.user .bubble { background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot .bubble { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .answer-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px 11px; margin-bottom: 8px; background: #fbfcfe; }
    .answer-card.sokuho { border-color: #e0a300; background: #fffaf0; }
    .answer-card:last-of-type { margin-bottom: 0; }
    .answer-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
    .verdict {
      font-size: 0.7rem; font-weight: 700; color: #fff;
      padding: 2px 8px; border-radius: 999px;
    }
    .v-ok { background: var(--ok); } .v-ng { background: var(--ng); }
    .v-cond { background: var(--cond); } .v-info { background: var(--info); }
    .cat-tag, .date-tag { font-size: 0.68rem; color: var(--sub); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
    .answer-body { white-space: pre-wrap; }
    .refs { margin-top: 7px; font-size: 0.72rem; color: var(--sub); border-top: 1px dashed var(--border); padding-top: 6px; }
    .refs-label { font-weight: 700; }
    .related { margin-top: 8px; }
    .related-label { font-size: 0.72rem; color: var(--sub); margin-bottom: 2px; }
    .disclaimer-inline { margin-top: 8px; font-size: 0.68rem; color: var(--sub); }
    .meta-note { margin-top: 6px; font-size: 0.66rem; color: var(--sub); }
    .input-area {
      flex: none; display: flex; gap: 8px; padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
      background: var(--bg);
    }
    #chat-input {
      flex: 1; resize: none; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 10px 12px; font-size: 16px; font-family: inherit; background: var(--panel);
      line-height: 1.5; max-height: 100px;
    }
    #chat-input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    #btn-send {
      flex: none; border: none; background: var(--accent); color: #fff;
      border-radius: var(--radius); padding: 0 18px; font-size: 0.9rem; font-weight: 700; cursor: pointer;
    }
    #btn-send:active { opacity: 0.85; }
    footer.app-footer { flex: none; text-align: center; font-size: 0.62rem; color: var(--sub); padding: 0 12px 6px; }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>⚖️ 医療機器業公正競争規約Q&A</h1>
    <p class="subtitle">贈答・接待・貸出し・立会い・サンプル・寄付…規約上のOK/NGを根拠条文つきで即回答</p>
  </header>

  <div class="quick-chips" id="quick-chips"></div>

  <div id="chat-log"></div>

  <div class="input-area">
    <textarea id="chat-input" rows="1" placeholder="質問を入力(例: 医師とのお食事の上限は?)" enterkeyhint="send"></textarea>
    <button id="btn-send">送信</button>
  </div>
  <footer class="app-footer">
    本アプリの回答は参考情報です。最終判断は医療機器業公正取引協議会にご確認ください。
  </footer>

  <script src="js/kiyaku-data.js"></script>
  <script src="js/sokuho-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
